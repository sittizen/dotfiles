onboarding = false
# Herdr configuration translated from ~/.tmux.conf.

# ─── Terminal defaults ──────────────────────────────────────────────────────
# tmux: set-option -g default-shell /bin/zsh
[terminal]
default_shell = "/bin/zsh"

# ─── Theme ──────────────────────────────────────────────────────────────────
# tmux: set -g @plugin 'catppuccin/tmux#v2.1.3'
# tmux: set -g @catppuccin_flavor "frappe"
#   herdr ships only two catppuccin variants: `catppuccin` (mocha) and
#   `catppuccin-latte`. There is no `frappe` flavor, so `catppuccin` is the
#   closest dark equivalent. Switch with theme.name = "catppuccin-latte"
#   for the light variant.
[theme]
name = "catppuccin"

# ─── Keybindings ────────────────────────────────────────────────────────────
[keys]
prefix = "ctrl+space"
workspace_picker = "ctrl+f9"
copy_mode = "prefix+v"
close_pane = "prefix+x"


# [] [][][1] [][][]
focus_pane_left = "alt+j"
focus_pane_down = "alt+k"
focus_pane_up = "alt+i"
focus_pane_right = "alt+l"
zoom = "alt+a"
new_tab = "alt+c"
# tmux: bind-key -n M-r split-window -h \; resize-pane -x "40%"
# tmux: bind-key -n M-t split-window -h
#   Both tmux bindings open the same side-by-side split; herdr has no
#   percentage-based resize API, so the `resize-pane -x "40%"` half of M-r
#   has no equivalent. Both chords map to herdr's split_vertical; delete
#   one of them if you only want to keep a single shortcut.
split_vertical = ["alt+r", "alt+t"]
split_horizontal = "alt+d"


# ─── Custom command bindings (popup popovers) ────────────────────────────────
# [] [1][][] [2][][]
[[keys.command]]
key = "ctrl+f1"
type = "popup"
command = "btop"
width = "90%"
height = "90%"
description = "btop system monitor"

[[keys.command]]
key = "ctrl+f2"
type = "popup"
command = "cd ~/Documents && kpcli --kdb=uris_and_secrets.kdbx"
width = "90%"
height = "90%"
description = "kpcli password manager"

[[keys.command]]
key = "ctrl+f4"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"
description = "lazygit"

[[keys.command]]
key = "ctrl+f5"
type = "popup"
command = "lazydocker"
width = "90%"
height = "90%"
description = "lazydocker"

[[keys.command]]
key = "ctrl+f6"
type = "popup"
command = "tuicr"
width = "90%"
height = "90%"
description = "tuicr"

[[keys.command]]
key = "ctrl+f7"
type = "popup"
command = "nvim /tmp/scratch"
width = "90%"
height = "90%"
description = "nvim scratch buffer"

[[keys.command]]
key = "ctrl+f8"
type = "popup"
command = "sh -c 'sem diff -v --color=always | less -R'"
width = "90%"
height = "90%"
description = "sem diff viewer"

[[keys.command]]
key = "ctrl+f10"
type = "popup"
command = "nvim ."
width = "60%"
height = "100%"
description = "nvim current directory"


# ─── Detached shell commands ────────────────────────────────────────────────
# [2] [1][][] [][][]
[[keys.command]]
key = "prefix+l"
type = "shell"
command = "~/workspace/gobbo/next.sh >/dev/null 2>&1"
description = "gobbo next"

[[keys.command]]
key = "prefix+j"
type = "shell"
command = "~/workspace/gobbo/prev.sh >/dev/null 2>&1"
description = "gobbo prev"

# ─── Items without a herdr equivalent ───────────────────────────────────────
#
#
# tmux: set -g @plugin 'tmux-plugins/tmux-open'
# tmux: set -g @plugin 'tmux-plugins/tmux-yank'
#   tmux-only plugins. herdr covers yank-style copy with mouse drag-select
#   (`ui.copy_on_select = true`, default) and open with right-click menus.

[ui]
agent_panel_sort = "spaces"
